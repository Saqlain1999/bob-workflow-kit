name: Bob compatibility result
description: Share a first trial, including a failure or confusing step.
title: "Compatibility: "
body:
  - type: input
    id: kit
    attributes:
      label: Kit version or commit
    validations:
      required: true
  - type: input
    id: bob
    attributes:
      label: Bob version and interface
      description: State IDE or Shell and the exact version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python version, and execution host
      description: State local, remote SSH, or container; omit confidential hostnames.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Observed results
      description: Separate installer integrity, native client loading, and task/check behaviour. A short result is welcome; keep unknowns explicit.
      value: |
        Install / doctor: PASS / FAIL / NOT RUN
        Native rule / skill loading: OBSERVED / NOT VERIFIED
        Exercise and outcome: Tiny Ledger / Parcel Resume / other; PASS / FAIL / NOT RUN
        Existing project rules or other workflow tools:
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: First confusing or failing step
      description: What happened, what did you expect, and what would have helped?
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised reproduction and evidence
      description: Include commands and real outcomes. Do not include credentials or private source/logs.
